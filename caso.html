<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Victor Castro Medina — Proyecto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F7F2E9;--ink:#1C1C1A;--dark:#141413;--dark2:#1F1F1C;--steel:#83837A;--line:#DEDED4;--line-d:#34342F;--signal:#C85A28;--signal-l:#E07A48}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans',-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.wrap{max-width:1240px;margin:0 auto;padding:0 32px}
nav.top{position:fixed;inset:0 0 auto 0;z-index:50;background:rgba(20,20,19,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line-d)}
nav.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;color:#EDEAE2;gap:16px}
nav.top .brand{font-weight:600;letter-spacing:-.01em;white-space:nowrap}
nav.top .r{display:flex;gap:22px;align-items:center;font-size:.85rem}
nav.top .back{font-family:'IBM Plex Mono',monospace;font-size:.75rem;opacity:.75}
nav.top .back:hover{opacity:1;color:var(--signal-l)}
.lang{display:flex;gap:2px}
.lang button{font-family:'IBM Plex Mono',monospace;font-size:.7rem;background:none;border:none;color:inherit;opacity:.5;cursor:pointer;padding:4px 6px}
.lang button.active{opacity:1;color:var(--signal-l)}

.head{background:var(--dark);color:#EDEAE2;padding:140px 0 0}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--signal-l);letter-spacing:.06em;text-transform:uppercase}
.head h1{font-size:clamp(2.2rem,5vw,4rem);line-height:1.04;font-weight:600;letter-spacing:-.03em;margin:20px 0 18px;max-width:1000px}
.head .sub{font-size:1.15rem;color:#C9C6BC;font-weight:300;max-width:760px;line-height:1.5}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;border-top:1px solid var(--line-d);margin-top:48px;padding:24px 0 56px}
.facts span{display:block;font-family:'IBM Plex Mono',monospace;font-size:.68rem;color:#8E8B82;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.facts b{font-weight:500;font-size:.95rem;line-height:1.4;color:#EDEAE2}
.herowrap{background:linear-gradient(var(--dark) 50%,var(--paper) 50%)}
.hero{border-radius:6px;overflow:hidden;background:#E9E4DA;cursor:zoom-in;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.hero img{width:100%;max-height:82vh;object-fit:contain;margin:0 auto}

.story{padding:100px 0 30px}
.blk{display:grid;grid-template-columns:240px 1fr;gap:40px;padding:38px 0;border-top:1px solid var(--line)}
.blk h2{font-family:'IBM Plex Mono',monospace;font-size:.78rem;font-weight:500;color:var(--signal);text-transform:uppercase;letter-spacing:.06em;padding-top:8px}
.blk h2 i{font-style:normal;color:var(--steel);margin-right:10px}
.blk p{font-size:clamp(1.08rem,1.6vw,1.3rem);line-height:1.6;max-width:820px;font-weight:400}
.blk.res p{font-size:clamp(1.25rem,2.1vw,1.7rem);line-height:1.45;font-weight:500;letter-spacing:-.01em}

.gal{padding:40px 0 110px}
.gal .ghead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:28px;font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--steel);text-transform:uppercase;letter-spacing:.05em}
.masonry{column-count:2;column-gap:24px}
.masonry a{display:block;break-inside:avoid;margin-bottom:24px;border-radius:4px;overflow:hidden;background:#E9E4DA;cursor:zoom-in}
.masonry img{width:100%;transition:transform .6s ease}
.masonry a:hover img{transform:scale(1.03)}

.next{background:var(--dark);color:#EDEAE2;padding:90px 0}
.next a.nx{display:grid;grid-template-columns:1fr 1.1fr;gap:48px;align-items:center}
.next .lbl{font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:var(--signal-l);text-transform:uppercase;letter-spacing:.06em}
.next h3{font-size:clamp(1.8rem,3.4vw,2.8rem);font-weight:600;letter-spacing:-.025em;line-height:1.08;margin:16px 0 14px}
.next p{color:#A9A69C;line-height:1.5}
.next .im{border-radius:6px;overflow:hidden;aspect-ratio:4/3}
.next .im img{width:100%;height:100%;object-fit:cover;transition:transform .7s ease}
.next a.nx:hover .im img{transform:scale(1.05)}
.next a.nx:hover h3{color:var(--signal-l)}
.next .row{display:flex;justify-content:space-between;border-top:1px solid var(--line-d);margin-top:70px;padding-top:22px;font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:#8E8B82;flex-wrap:wrap;gap:12px}
.next .row a:hover{color:var(--signal-l)}

/* lightbox */
.lb{position:fixed;inset:0;z-index:100;background:rgba(12,12,11,.96);display:none;align-items:center;justify-content:center}
.lb.on{display:flex}
.lb img{max-width:92vw;max-height:86vh;object-fit:contain;border-radius:3px;user-select:none}
.lb button{position:absolute;background:none;border:none;color:#EDEAE2;font-family:'IBM Plex Mono',monospace;cursor:pointer;padding:16px;font-size:1.6rem;opacity:.75}
.lb button:hover{opacity:1;color:var(--signal-l)}
.lb .x{top:10px;right:14px;font-size:1.2rem}
.lb .p{left:8px;top:50%;transform:translateY(-50%)}
.lb .n{right:8px;top:50%;transform:translateY(-50%)}
.lb .c{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:.75rem;color:#8E8B82}

/* reveal */
.rv{opacity:0;transform:translateY(24px);transition:opacity .8s ease,transform .8s ease}
.rv.in{opacity:1;transform:none}
.wipe{clip-path:inset(100% 0 0 0);transition:clip-path 1.1s cubic-bezier(.77,0,.18,1)}
.wipe img{transform:scale(1.2);transition:transform 1.5s cubic-bezier(.2,.7,.2,1)}
.wipe.in{clip-path:inset(0)}
.wipe.in img{transform:scale(1)}
.wipe.in:hover img{transform:scale(1.03)}
@media (prefers-reduced-motion:reduce){.rv,.wipe,.wipe img{transition:none!important;opacity:1!important;transform:none!important;clip-path:none!important}}

@media (max-width:480px){nav.top .brand{display:none}nav.top .back{white-space:nowrap}}
@media (max-width:900px){
  .wrap{padding:0 16px}
  nav.top .brand{font-size:.9rem}
  .head{padding-top:110px}
  .facts{grid-template-columns:1fr 1fr}
  .blk{grid-template-columns:1fr;gap:12px}
  .story{padding-top:70px}
  .masonry{column-count:1}
  .next a.nx{grid-template-columns:1fr;gap:28px}
  .next a.nx .im{order:-1}
}

/* ===== minimal overrides ===== */
nav.top{background:rgba(247,242,233,.94);border-bottom:1px solid var(--line)}
nav.top .wrap{color:var(--ink)}
nav.top .back:hover{color:var(--ink);text-decoration:underline;text-underline-offset:4px}
.lang button.active{color:var(--ink);text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--signal)}
.head{background:var(--paper);color:var(--ink)}
.eyebrow{color:var(--steel)}
.head h1{font-weight:500;font-size:clamp(2rem,4.2vw,3.3rem);letter-spacing:-.03em}
.head .sub{color:#55554E;font-size:1.05rem}
.facts{border-top:1px solid var(--line);padding-bottom:40px}
.facts span{color:var(--steel)}
.facts b{color:var(--ink);font-weight:400}
.herowrap{background:none}
.hero{box-shadow:none;background:#ECE7DE;border-radius:4px}
.blk{border-top:1px solid var(--line)}
.blk h2{color:var(--ink)}
.blk p{font-weight:400;color:#33332F}
.blk.res p{font-weight:500;color:var(--ink)}
.masonry a{background:#ECE7DE}
.next{background:var(--paper);color:var(--ink);border-top:1px solid var(--line)}
.next .lbl{color:var(--steel)}
.next h3{font-weight:500}
.next p{color:var(--steel)}
.next a.nx:hover h3{color:var(--ink);text-decoration:underline;text-underline-offset:6px}
.next .im{background:#ECE7DE}
.next .row{border-top:1px solid var(--line);color:var(--steel)}
.next .row a:hover{color:var(--ink)}
</style>
</head>
<body>
<nav class="top">
  <div class="wrap">
    <a class="brand" href="index.html">Victor Castro Medina</a>
    <div class="r">
      <a class="back" id="back" href="index.html#work" data-u="back">← Todos los proyectos</a>
      <div class="lang"><button data-lang="es">ES</button><button data-lang="en">EN</button><button data-lang="fr">FR</button></div>
    </div>
  </div>
</nav>

<header class="head">
  <div class="wrap">
    <p class="eyebrow" id="eyebrow"></p>
    <h1 id="title"></h1>
    <p class="sub" id="sub"></p>
    <div class="facts">
      <div><span id="clientlbl" data-u="client">Cliente</span><b id="client"></b></div>
      <div><span data-u="role">Rol</span><b id="role"></b></div>
      <div><span data-u="disc">Disciplina</span><b id="disc"></b></div>
      <div><span data-u="imgs">Material visual</span><b id="nimg"></b></div>
    </div>
  </div>
</header>
<div class="herowrap"><div class="wrap"><div class="hero" id="hero"><img id="heroimg" alt=""></div></div></div>

<section class="story">
  <div class="wrap">
    <div class="blk rv"><h2><i>01</i><span data-u="challenge">Reto</span></h2><p id="challenge"></p></div>
    <div class="blk rv"><h2><i>02</i><span data-u="process">Proceso</span></h2><p id="process"></p></div>
    <div class="blk rv res"><h2><i>03</i><span data-u="result">Resultado</span></h2><p id="result"></p></div>
  </div>
</section>

<section class="gal">
  <div class="wrap">
    <div class="ghead"><span data-u="gallery">Galería</span><span data-u="tap">Clic para ampliar</span></div>
    <div class="masonry" id="gallery"></div>
  </div>
</section>

<section class="next">
  <div class="wrap">
    <a class="nx" id="nx">
      <div><p class="lbl" data-u="nextp">Siguiente proyecto</p><h3 id="nxt"></h3><p id="nxs"></p></div>
      <div class="im"><img id="nxi" alt=""></div>
    </a>
    <div class="row"><a id="prev"></a><a href="index.html#work" id="all" data-u="all">Todos los proyectos</a><a href="mailto:vacm182@hotmail.com">vacm182@hotmail.com</a></div>
  </div>
</section>

<div class="lb" id="lb"><button class="x" data-u-aria="close">✕</button><button class="p">←</button><img id="lbimg" alt=""><button class="n">→</button><div class="c" id="lbc"></div></div>

<script src="cases.js"></script>
<script>
var U={
  back:{es:"← Todos los proyectos",en:"← All projects",fr:"← Tous les projets"},
  client:{es:"Cliente",en:"Client",fr:"Client"},
  company:{es:"Empresa",en:"Company",fr:"Entreprise"},
  role:{es:"Rol",en:"Role",fr:"Rôle"},
  disc:{es:"Disciplina",en:"Discipline",fr:"Discipline"},
  imgs:{es:"Material visual",en:"Visual material",fr:"Visuels"},
  challenge:{es:"Reto",en:"Challenge",fr:"Défi"},
  process:{es:"Proceso",en:"Process",fr:"Démarche"},
  result:{es:"Resultado",en:"Result",fr:"Résultat"},
  gallery:{es:"Galería",en:"Gallery",fr:"Galerie"},
  tap:{es:"Clic para ampliar",en:"Click to enlarge",fr:"Cliquer pour agrandir"},
  nextp:{es:"Siguiente proyecto",en:"Next project",fr:"Projet suivant"},
  prevp:{es:"← Anterior",en:"← Previous",fr:"← Précédent"},
  all:{es:"Todos los proyectos",en:"All projects",fr:"Tous les projets"},
  images:{es:"imágenes",en:"images",fr:"images"}
};
var CAT={packaging:{es:"Packaging",en:"Packaging",fr:"Emballage"},hardware:{es:"Diseño industrial",en:"Industrial design",fr:"Design industriel"},pos:{es:"Punto de venta",en:"Point of sale",fr:"PLV"},eventos:{es:"Espacios y eventos",en:"Spaces & events",fr:"Espaces et événements"}};
var ROLEV={es:"Diseño e ingeniería de producto PET · Envases Universales",en:"PET product design & engineering · Envases Universales",fr:"Design et ingénierie produit PET · Envases Universales"};
var ORDER=["packaging","hardware","pos","eventos"];
CASES.forEach(function(c){c.cat=c.cat||"packaging";});
var ALL=CASES.slice().sort(function(a,b){return ORDER.indexOf(a.cat)-ORDER.indexOf(b.cat);});
var slug=new URLSearchParams(location.search).get('c')||ALL[0].slug;
var i=ALL.findIndex(function(c){return c.slug===slug;}); if(i<0)i=0;
var C=ALL[i], P=ALL[(i-1+ALL.length)%ALL.length], N=ALL[(i+1)%ALL.length], L="es";
function img(n){return 'images/'+(C.dir||'packaging')+'/'+C.slug+'-'+(n<10?'0':'')+n+'.jpg';}
var IMGS=[]; for(var k=1;k<=C.count;k++) IMGS.push(img(k));

document.getElementById('heroimg').src=IMGS[0];
document.getElementById('hero').onclick=function(){openLb(0);};
document.getElementById('gallery').innerHTML=IMGS.slice(1).map(function(s,j){return '<a class="wipe" data-i="'+(j+1)+'"><img src="'+s+'" loading="lazy" alt=""></a>';}).join('');
document.querySelectorAll('#gallery a').forEach(function(a){a.onclick=function(){openLb(+a.dataset.i);};});
document.getElementById('client').textContent=C.brand;
if(C.cat==='hardware') document.getElementById('clientlbl').setAttribute('data-u','company');
document.getElementById('nxi').src='images/covers/'+N.slug+'.jpg';

window.onLang=function(l){
  L=l; var t=C[l];
  document.querySelectorAll('[data-u]').forEach(function(el){var k=el.getAttribute('data-u'); if(U[k]) el.textContent=U[k][l];});
  document.title=t.title+' — Victor Castro Medina';
  document.getElementById('eyebrow').textContent=CAT[C.cat][l]+' · '+C.brand.split(' · ')[0];
  ['title','sub','challenge','process','result'].forEach(function(k){document.getElementById(k).textContent=t[k];});
  document.getElementById('role').textContent=t.role||ROLEV[l];
  document.getElementById('disc').textContent=CAT[C.cat][l];
  document.getElementById('nimg').textContent=C.count+' '+U.images[l];
  document.getElementById('heroimg').alt=t.title;
  document.getElementById('back').href='index.html?lang='+l+'#work';
  document.getElementById('all').href='index.html?lang='+l+'#work';
  var nx=document.getElementById('nx'); nx.href='caso.html?c='+N.slug+'&lang='+l;
  document.getElementById('nxt').textContent=N[l].title; document.getElementById('nxs').textContent=N[l].sub;
  var pv=document.getElementById('prev'); pv.href='caso.html?c='+P.slug+'&lang='+l; pv.textContent=U.prevp[l]+': '+P[l].title;
};

/* lightbox */
var lb=document.getElementById('lb'), cur=0;
function openLb(n){cur=n; show(); lb.classList.add('on'); document.body.style.overflow='hidden';}
function close(){lb.classList.remove('on'); document.body.style.overflow='';}
function show(){cur=(cur+IMGS.length)%IMGS.length; document.getElementById('lbimg').src=IMGS[cur]; document.getElementById('lbc').textContent=(cur+1)+' / '+IMGS.length;}
lb.querySelector('.x').onclick=close;
lb.querySelector('.p').onclick=function(e){e.stopPropagation();cur--;show();};
lb.querySelector('.n').onclick=function(e){e.stopPropagation();cur++;show();};
lb.onclick=function(e){if(e.target===lb)close();};
document.addEventListener('keydown',function(e){if(!lb.classList.contains('on'))return; if(e.key==='Escape')close(); if(e.key==='ArrowLeft'){cur--;show();} if(e.key==='ArrowRight'){cur++;show();}});
var sx=null; lb.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;},{passive:true});
lb.addEventListener('touchend',function(e){if(sx===null)return; var dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>40){cur+=dx<0?1:-1;show();} sx=null;});

/* reveal */
var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});},{threshold:.1});
document.querySelectorAll('.rv,.wipe').forEach(function(el){io.observe(el);});
</script>
<script src="i18n.js"></script>
</body>
</html>
